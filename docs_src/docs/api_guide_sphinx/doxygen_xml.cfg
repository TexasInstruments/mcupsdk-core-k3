# Doxygen configuration for XML-only output (used by Sphinx/breathe)
# Common settings shared by every device. Included by each
# doxygen_<device>_xml.cfg via @INCLUDE -- only OUTPUT_DIRECTORY and the
# device-specific INPUT += list live in those per-device files.

GENERATE_HTML          = NO
GENERATE_LATEX         = NO
GENERATE_XML           = YES
XML_OUTPUT             = xml
XML_PROGRAMLISTING     = NO

# Extraction/parsing settings carried over from the legacy doxygen.cfg base
# config, which the per-device flat INPUT lists never inherited. Without
# these, undocumented members/compounds are dropped instead of extracted,
# and typedef'd anonymous structs/enums (e.g. MCSPI_DmaChConfig) don't get
# a resolvable \ref/\link target.
EXTRACT_ALL            = YES
EXTRACT_STATIC         = YES
EXTRACT_PRIVATE        = YES
EXTRACT_LOCAL_CLASSES  = YES
EXTRACT_ANON_NSPACES   = YES
EXTRACT_LOCAL_METHODS  = YES
HIDE_UNDOC_MEMBERS     = NO
HIDE_UNDOC_CLASSES     = NO
CASE_SENSE_NAMES       = YES
BUILTIN_STL_SUPPORT    = NO
TYPEDEF_HIDES_STRUCT   = YES
ENABLE_PREPROCESSING   = YES
MACRO_EXPANSION        = NO
EXPAND_ONLY_PREDEF     = NO
PREDEFINED             = PTCP_SUPPORT
ABBREVIATE_BRIEF       = NO
FILE_PATTERNS          = *.h
INCLUDE_FILE_PATTERNS  = *.h
INLINE_INHERITED_MEMB  = YES
OPTIMIZE_OUTPUT_FOR_C  = YES
SORT_GROUP_NAMES       = YES
SORT_MEMBER_DOCS       = NO
