#-----------------------------------------------------------------------------#
#                                                                             #
#      DEFAULT CONFIGURATION FILE TO BE USED WITH THE FLASHWRITER SCRIPT      #
#                                                                             #
#-----------------------------------------------------------------------------#
#
# By default this config file,
# - points to pre-built flash writer, bootloader for this EVM
# - The application image points to relative path of the ipc rpmsg linux application image for this EVM
#   - Make sure this application is built before running this script
# - You can customized this config file to point to your own bootloader and/or application images
# - You can use --operation=flashverify if you just want to verify the flash contents and not flash the file.
#

# First point to sbl_uart_uniflash binary, which function's as a server to flash one or more files
--flash-writer=sbl_prebuilt/am275x-evm/sbl_uart_uniflash.release.hs_fs.tiimage

# Program the OSPI PHY tuning attack vector
--operation=flash-phy-tuning-data

# Now send one or more files to flash or flashverify as needed. The order of sending files does not matter

# When sending bootloader make sure to flash at offset 0x0. ROM expects bootloader at offset 0x0
--file=sbl_prebuilt/am275x-evm/sbl_ospi.release.hs_fs.tiimage --operation=flash --flash-offset=0x0

# When sending application image, make sure to flash at offset 0x400000 (default) or to whatever offset your bootloader is configured for
--file=../../examples/drivers/pmic/pmic_trigger_watchdog_reset/am275x-evm/r5fss0-0_freertos/ti-arm-clang/pmic_trigger_watchdog_reset.release.mcelf.hs_fs --operation=flash --flash-offset=0x400000

# When sending application image, make sure to flash at offset 0x800000 (default) or to whatever offset your bootloader is configured for
--file=../../examples/drivers/ipc/ipc_rpmsg_echo/am275x-evm/r5fss0-1_freertos/ti-arm-clang/ipc_rpmsg_echo.release.mcelf.hs_fs --operation=flash --flash-offset=0x800000

# When sending application image, make sure to flash at offset 0xC00000 (default) or to whatever offset your bootloader is configured for
--file=../../examples/drivers/ipc/ipc_rpmsg_echo/am275x-evm/r5fss1-0_freertos/ti-arm-clang/ipc_rpmsg_echo.release.mcelf.hs_fs --operation=flash --flash-offset=0xC00000

# When sending application image, make sure to flash at offset 0x1000000 (default) or to whatever offset your bootloader is configured for
--file=../../examples/drivers/ipc/ipc_rpmsg_echo/am275x-evm/r5fss1-1_freertos/ti-arm-clang/ipc_rpmsg_echo.release.mcelf.hs_fs --operation=flash --flash-offset=0x1000000

# When sending application image, make sure to flash at offset 0x1400000 (default) or to whatever offset your bootloader is configured for
--file=../../examples/drivers/ipc/ipc_rpmsg_echo/am275x-evm/c75ss0-0_freertos/ti-c7000/ipc_rpmsg_echo.release.mcelf.hs_fs --operation=flash --flash-offset=0x1400000

# When sending application image, make sure to flash at offset 0x1800000 (default) or to whatever offset your bootloader is configured for
--file=../../examples/drivers/ipc/ipc_rpmsg_echo/am275x-evm/c75ss1-0_freertos/ti-c7000/ipc_rpmsg_echo.release.mcelf.hs_fs --operation=flash --flash-offset=0x1800000



