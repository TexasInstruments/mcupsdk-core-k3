#-----------------------------------------------------------------------------#
#                                                                             #
#      SBL TEST CONFIGURATION FILE TO BE USED WITH THE FLASHWRITER SCRIPT     #
#                                                                             #
#-----------------------------------------------------------------------------#
#
# By default this config file,
# - points to pre-built flash writer, bootloader for this EVM
# - Make sure applications are built before running this script
# - You can use --operation=flashverify if you just want to verify the flash contents and not flash the file.
#

## Uniflash binary ##

# First point to sbl_uart_uniflash binary, which functions as a server to flash one or more files
--flash-writer=sbl_prebuilt/am275x-evm/sbl_uart_uniflash.release.hs_fs.tiimage

# Flash the test_sbl_media_boot at 0x0 (loaded by ROM on next boot)
--file=../../test/drivers/boot/sbl_test_media_boot/am275x-evm/wkup-r5fss0-0_freertos/ti-arm-clang/test_sbl_media_boot.release.hs_fs.tiimage --operation=flash --flash-offset=0x0

## These are single core images ##

# R5FSS0_0 image is flashed to eMMC at 0x800000 (CONFIG_BOOTLOADER_EMMC_MCU)
--file=../../examples/drivers/ipc/ipc_rpmsg_echo/am275x-evm/r5fss0-0_freertos/ti-arm-clang/ipc_rpmsg_echo.release.mcelf.hs_fs --operation=flash-emmc --flash-offset=0x800000

# C75SS0_0 image is flashed to OSPI flash at 0xA00000 (CONFIG_BOOTLOADER_FLASH_DSP)
--file=../../examples/drivers/ipc/ipc_rpmsg_echo/am275x-evm/c75ss0-0_freertos/ti-c7000/ipc_rpmsg_echo.release.mcelf.hs_fs --operation=flash --flash-offset=0xA00000

# NOTE: AM275x has no A53 SMP core; the SMP boot tests (CONFIG_BOOTLOADER_EMMC_SMP at
# eMMC 0xA00000 and CONFIG_BOOTLOADER_FLASH_SMP at flash 0x800000) are skipped at runtime.
# No images need to be flashed for those offsets.

## These are the multicore images ##

# System image to be booted from eMMC at 0x1200000 (CONFIG_BOOTLOADER_EMMC_MULTICORE)
--file=../../test/drivers/ipc_rpmsg/am275x-evm/system_freertos/test_ipc_rpmsg_system.release.mcelf.hs_fs --operation=flash-emmc --flash-offset=0x1200000

# System image to be booted from flash at 0x1200000 (CONFIG_BOOTLOADER_FLASH_MULTICORE)
--file=../../test/drivers/ipc_rpmsg/am275x-evm/system_freertos/test_ipc_rpmsg_system.release.mcelf.hs_fs --operation=flash --flash-offset=0x1200000
