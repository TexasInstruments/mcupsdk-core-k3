#-----------------------------------------------------------------------------#
#                                                                             #
#      SBL TEST CONFIGURATION FILE TO BE USED WITH THE FLASHWRITER SCRIPT     #
#                                                                             #
#-----------------------------------------------------------------------------#
#
# By default this config file,
# - points to pre-built flash writer, bootloader for this EVM
# - Make sure  application are built before running this script
# - You can use --operation=flashverify-emmc if you just want to verify the flash contents and not flash the file.
#

## Uniflash stage1 and stage2 binaries ##

# First point to sbl_uart_uniflash_stage1 binary, which initialises DDR and receives sbl_uart_uniflash_stage2 binary
--flash-writer=sbl_prebuilt/am62ax-sk/sbl_uart_uniflash_stage1.release.hs_fs.tiimage

# Points to sbl_uart_uniflash_stage2 binary, which function's as a server to flash one or more files to eMMC
--file=../../examples/drivers/boot/sbl_uart_uniflash_multistage/sbl_uart_uniflash_stage2/am62ax-sk/r5fss0-0_nortos/ti-arm-clang/sbl_uart_uniflash_stage2.release.appimage.hs_fs --operation=flash --flash-offset=0x0

## These are single core images ##

# MCU-R5F image is flashed at 0x800000 or to whatever offset your bootloader is configured for
--file=../../examples/drivers/ipc/ipc_rpmsg_echo/am62ax-sk/mcu-r5fss0-0_freertos/ti-arm-clang/ipc_rpmsg_echo.release.appimage.hs_fs --operation=flash-emmc --flash-offset=0x800000

# C7x image is flashed at 0xA00000 or to whatever offset your bootloader is configured for
--file=../../examples/drivers/ipc/ipc_rpmsg_echo/am62ax-sk/c75ss0-0_freertos/ti-c7000/ipc_rpmsg_echo.release.appimage.hs_fs --operation=flash --flash-offset=0xA00000

# A53 image is flashed at 0xC00000 or to whatever offset your bootloader is configured for
--file=../../examples/drivers/ipc/ipc_rpmsg_echo/am62ax-sk/a53ss0-0_nortos/gcc-aarch64/ipc_rpmsg_echo.release.appimage.hs_fs --operation=flash --flash-offset=0xC00000

# A53 image is also flashed to eMMC at 0xC00000 for MMCSD raw boot test
--file=../../examples/drivers/ipc/ipc_rpmsg_echo/am62ax-sk/a53ss0-0_nortos/gcc-aarch64/ipc_rpmsg_echo.release.appimage.hs_fs --operation=flash-emmc --flash-offset=0xC00000

## These are the SMP images ##

# Load the SMP image to be booted from EMMC to 0xA00000
--file=../../test/drivers/mmcsd/test_mmcsd_fs_io/am62ax-sk/a53ss0-0_freertos-smp/gcc-aarch64/test_mmcsd_fs_io.release.appimage.hs_fs --operation=flash-emmc --flash-offset=0xA00000

#Load the SMP image to be booted from Flash to 0x800000
--file=../../test/drivers/mmcsd/test_mmcsd_fs_io/am62ax-sk/a53ss0-0_freertos-smp/gcc-aarch64/test_mmcsd_fs_io.release.appimage.hs_fs --operation=flash --flash-offset=0x800000

## These are the multicore images ##

# System image to be booted from EMMC ##
--file=../../test/drivers/ipc_rpmsg/am62ax-sk/system_freertos/test_ipc_rpmsg_system.release.appimage.hs_fs --operation=flash-emmc --flash-offset=0x1200000

#System image to be booted from flash
--file=../../test/drivers/ipc_rpmsg/am62ax-sk/system_freertos/test_ipc_rpmsg_system.release.appimage.hs_fs --operation=flash --flash-offset=0x1200000

## HSM appimage for TestSbl_hsmAppimageBoot ##
# Generated by: cd tools/boot/HSMAppimageGen/board/am62ax-sk && make
# Packages HSM_min_sample.bin into a signed RPRC appimage (CSL_CORE_ID_HSM_M4FSS0_0,
# load address 0x43C00000) and signs it with the HS-FS development key.
# The output hsm.appimage.hs_fs must be present before running this script.
--file=../../tools/boot/HSMAppimageGen/board/am62ax-sk/hsm.appimage.hs_fs --operation=flash-emmc --flash-offset=0x1400000
