#-----------------------------------------------------------------------------#
#                                                                             #
#      SBL TEST CONFIGURATION FILE TO BE USED WITH THE FLASHWRITER SCRIPT     #
#                                                                             #
#-----------------------------------------------------------------------------#
#
# By default this config file,
# - points to pre-built flash writer, bootloader for this EVM
# - Make sure  application are built before running this script
# - You can use --operation=flashverify-emmc if you just want to verify the flash contents and not flash the file.
#
# NOTE (AM62Px): am62px-sk has no A53 or C75/DSP core in silicon, and no A53
# example board exists in this SDK checkout (no a53ss0-0 example dirs). The
# A53 single-core, A53 SMP, and C75 image lines present in the am62ax-sk /
# am62dx-evm version of this file are therefore omitted here.
#

## Uniflash stage1 and stage2 binaries ##

# First point to sbl_uart_uniflash_stage1 binary, which initialises DDR and receives sbl_uart_uniflash_stage2 binary
--flash-writer=sbl_prebuilt/am62px-sk/sbl_uart_uniflash_stage1.release.hs_fs.tiimage

# Points to sbl_uart_uniflash_stage2 binary, which function's as a server to flash one or more files to eMMC
--file=../../examples/drivers/boot/sbl_uart_uniflash_multistage/sbl_uart_uniflash_stage2/am62px-sk/wkup-r5fss0-0_nortos/ti-arm-clang/sbl_uart_uniflash_stage2.release.appimage.hs_fs --operation=flash --flash-offset=0x0

## This is the single-core image (MCU-R5F; am62px-sk has no A53/C75 board) ##

# MCU-R5F image is flashed at 0x800000 or to whatever offset your bootloader is configured for
--file=../../examples/drivers/ipc/ipc_rpmsg_echo/am62px-sk/mcu-r5fss0-0_freertos/ti-arm-clang/ipc_rpmsg_echo.release.appimage.hs_fs --operation=flash-emmc --flash-offset=0x800000

# MCU-R5F image to be booted from OSPI flash (TestSbl_singleCoreImageOspiBoot;
# CONFIG_BOOTLOADER_FLASH_DSP appImageOffset = 0xA00000)
--file=../../examples/drivers/ipc/ipc_rpmsg_echo/am62px-sk/mcu-r5fss0-0_freertos/ti-arm-clang/ipc_rpmsg_echo.release.appimage.hs_fs --operation=flash --flash-offset=0xA00000

## This is the multicore image (MCU-R5F + WKUP-R5F only; am62px-sk has no A53/C75 board) ##

# System image to be booted from EMMC ##
--file=../../test/drivers/ipc_rpmsg/am62px-sk/system_freertos/test_ipc_rpmsg_system.release.appimage.hs_fs --operation=flash-emmc --flash-offset=0x1200000

#System image to be booted from flash
--file=../../test/drivers/ipc_rpmsg/am62px-sk/system_freertos/test_ipc_rpmsg_system.release.appimage.hs_fs --operation=flash --flash-offset=0x1200000

## HSM appimage for TestSbl_hsmAppimageBoot ##
# Generated by: cd tools/boot/HSMAppimageGen/board/am62px-sk && make
# Packages HSM_min_sample.bin into a signed RPRC appimage (CSL_CORE_ID_HSM_M4FSS0_0,
# load address 0x43C00000) and signs it with the HS-FS development key.
# The output hsm.appimage.hs_fs must be present before running this script.
--file=../../tools/boot/HSMAppimageGen/board/am62px-sk/hsm.appimage.hs_fs --operation=flash-emmc --flash-offset=0x1400000
