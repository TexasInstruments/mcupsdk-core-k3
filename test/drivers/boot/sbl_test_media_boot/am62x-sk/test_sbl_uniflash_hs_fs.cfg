#-----------------------------------------------------------------------------#
#                                                                             #
#      SBL TEST CONFIGURATION FILE TO BE USED WITH THE FLASHWRITER SCRIPT     #
#                                                                             #
#-----------------------------------------------------------------------------#

## Uniflash stage1 and stage2 binaries ##
--flash-writer=sbl_prebuilt/am62x-sk/sbl_uart_uniflash_stage1.release.hs_fs.tiimage

--file=../../examples/drivers/boot/sbl_uart_uniflash_multistage/sbl_uart_uniflash_stage2/am62x-sk/r5fss0-0_nortos/ti-arm-clang/sbl_uart_uniflash_stage2.release.appimage.hs_fs --operation=flash --flash-offset=0x0

## These are single core images ##

# M4F image is flashed to eMMC at 0x800000 (CONFIG_BOOTLOADER_EMMC_MCU eMMC boot test)
--file=../../examples/drivers/ipc/ipc_rpmsg_echo/am62x-sk/m4fss0-0_nortos/ti-arm-clang/ipc_rpmsg_echo.release.appimage.hs_fs --operation=flash-emmc --flash-offset=0x800000

# M4F image is flashed to OSPI at 0xA00000 (CONFIG_BOOTLOADER_FLASH_DSP OSPI boot test)
--file=../../examples/drivers/ipc/ipc_rpmsg_echo/am62x-sk/m4fss0-0_nortos/ti-arm-clang/ipc_rpmsg_echo.release.appimage.hs_fs --operation=flash --flash-offset=0xA00000

# A53 image is flashed at 0xC00000
--file=../../examples/drivers/ipc/ipc_rpmsg_echo/am62x-sk/a53ss0-0_freertos/gcc-aarch64/ipc_rpmsg_echo.release.appimage.hs_fs --operation=flash --flash-offset=0xC00000

# A53 image is also flashed to eMMC at 0xC00000 for MMCSD raw boot test
--file=../../examples/drivers/ipc/ipc_rpmsg_echo/am62x-sk/a53ss0-0_freertos/gcc-aarch64/ipc_rpmsg_echo.release.appimage.hs_fs --operation=flash-emmc --flash-offset=0xC00000

## These are the SMP images ##

# Load the SMP image to be booted from EMMC to 0xA00000
--file=../../test/drivers/mmcsd/test_mmcsd_fs_io/am62x-sk/a53ss0-0_freertos-smp/gcc-aarch64/test_mmcsd_fs_io.release.appimage.hs_fs --operation=flash-emmc --flash-offset=0xA00000

#Load the SMP image to be booted from Flash to 0x800000
--file=../../test/drivers/mmcsd/test_mmcsd_fs_io/am62x-sk/a53ss0-0_freertos-smp/gcc-aarch64/test_mmcsd_fs_io.release.appimage.hs_fs --operation=flash --flash-offset=0x800000

## These are the multicore images ##

# System image to be booted from EMMC ##
--file=../../test/drivers/ipc_rpmsg/am62x-sk/system_freertos/test_ipc_rpmsg_system.release.appimage.hs_fs --operation=flash-emmc --flash-offset=0x1200000

#System image to be booted from flash
--file=../../test/drivers/ipc_rpmsg/am62x-sk/system_freertos/test_ipc_rpmsg_system.release.appimage.hs_fs --operation=flash --flash-offset=0x1200000
