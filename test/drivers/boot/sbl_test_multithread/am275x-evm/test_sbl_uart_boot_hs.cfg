#-----------------------------------------------------------------------------#
#                                                                             #
#   CONFIG FILE FOR MULTITHREAD BOOT TEST — UART (direct ROM boot)           #
#                                                                             #
#-----------------------------------------------------------------------------#
#
# Direct ROM boot: send the sbl_test_multithread .tiimage to the AM275x ROM
# via XMODEM. The .tiimage is a flat binary (5-component certificate) that
# contains SBL code + embedded IPC appimages in a single SBL component.
#
--soc=am275x

--bootloader=../../test/drivers/boot/sbl_test_multithread/am275x-evm/wkup-r5fss0-0_freertos/ti-arm-clang/sbl_test_multithread.release.hs.tiimage
