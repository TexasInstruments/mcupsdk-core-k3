#-----------------------------------------------------------------------------#
#                                                                             #
#      SBL TEST CONFIGURATION FILE TO BE USED WITH THE FLASHWRITER SCRIPT    #
#                                                                             #
#-----------------------------------------------------------------------------#
#
# By default this config file,
# - points to pre-built flash writer, bootloader for this EVM
# - Make sure applications are built before running this script
# - You can use --operation=flashverify-emmc if you just want to verify the flash contents and not flash the file.
#

## Uniflash binary (single-stage for am275x) ##

# Points to sbl_uart_uniflash binary, which functions as a server to flash one or more files
--flash-writer=sbl_prebuilt/am275x-evm/sbl_uart_uniflash.release.hs_fs.tiimage

## These are single core images ##
#
# NOTE: Only R5FSS0_0 and C75SS0_0 images are flashed here.
# The R5FSS1_0 appimage (gAppImageBuf1) is embedded directly into the test
# binary via appimage_data.S (.incbin) and is not flashed separately.
#

# R5FSS0_0 image is flashed to eMMC at offset 0x800000 (CONFIG_BOOTLOADER_EMMC_MCU)
--file=../../test/drivers/boot/sbl_test_multithread/sbl_test_custom_ipc_binary/am275x-evm/r5fss0-0_freertos/ti-arm-clang/sbl_test_custom_ipc_binary.release.mcelf.hs_fs --operation=flash-emmc --flash-offset=0x800000

# C75SS0_0 image is flashed to OSPI at offset 0xA00000 (CONFIG_BOOTLOADER_FLASH_DSP)
--file=../../test/drivers/boot/sbl_test_multithread/sbl_test_custom_ipc_binary/am275x-evm/c75ss0-0_freertos/ti-c7000/sbl_test_custom_ipc_binary.release.mcelf.hs_fs --operation=flash --flash-offset=0xA00000
