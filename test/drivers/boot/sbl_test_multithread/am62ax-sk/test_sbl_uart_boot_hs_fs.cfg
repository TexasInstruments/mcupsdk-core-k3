#-----------------------------------------------------------------------------#
#                                                                             #
#   CONFIG FILE FOR MULTITHREAD BOOT TEST WITH EMBEDDED APPIMAGE BUFFERS     #
#                                                                             #
#-----------------------------------------------------------------------------#
#
# This config file is used with the SBL UART bootloader to set up the
# multithread boot test (TestSbl_multiThreadBoot).
#
# The SBL loads only the DM R5F test binary (sbl_test_multithread).
# Per-core appimages are embedded as initialized data sections within the
# test binary at fixed DDR addresses:
#   - MCU R5FSS0_0 appimage at 0x86000000
#   - A53SS0_0 appimage     at 0x86800000
#   - C75SS0_0 appimage     at 0x87000000
#
# Build the sbl_test_custom_ipc_binary per-core images BEFORE building
# sbl_test_multithread, as the test binary embeds them via appimage_data.S.
#

# SBL UART bootloader
--bootloader=sbl_prebuilt/am62ax-sk/sbl_uart.release.hs_fs.tiimage

# DM R5F test binary (sbl_test_multithread) with embedded per-core appimages
--file=../../test/drivers/boot/sbl_test_multithread/am62ax-sk/r5fss0-0_freertos/ti-arm-clang/sbl_test_multithread.release.appimage.hs_fs
