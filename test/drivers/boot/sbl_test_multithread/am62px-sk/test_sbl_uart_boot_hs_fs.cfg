#-----------------------------------------------------------------------------#
#                                                                             #
#   CONFIG FILE FOR MULTITHREAD BOOT TEST WITH EMBEDDED APPIMAGE BUFFERS     #
#                                                                             #
#-----------------------------------------------------------------------------#
#
# This config file is used with the SBL UART bootloader to set up the
# multithread boot test (TestSbl_multiThreadBoot).
#
# The SBL loads only the WKUP R5F test binary (sbl_test_multithread).
# The per-core appimage is embedded as an initialized data section within
# the test binary at a fixed DDR address:
#   - MCU R5FSS0_0 appimage at 0x86000000
#
# AM62PX: unlike am62ax-sk/am62dx-evm, no A53 or C75 example appimage is
# available on this board/checkout, so only the MCU-R5F core's appimage is
# embedded (see am62px-sk/wkup-r5fss0-0_freertos/appimage_data.S).
#
# Build the sbl_test_custom_ipc_binary/am62px-sk/mcu-r5fss0-0_freertos and
# wkup-r5fss0-0_freertos images BEFORE building sbl_test_multithread, as the
# test binary embeds the MCU-R5F image via appimage_data.S.
#

# SBL UART bootloader
--bootloader=sbl_prebuilt/am62px-sk/sbl_uart.release.hs_fs.tiimage

# WKUP R5F test binary (sbl_test_multithread) with embedded MCU-R5F appimage
--file=../../test/drivers/boot/sbl_test_multithread/am62px-sk/wkup-r5fss0-0_freertos/ti-arm-clang/sbl_test_multithread.release.appimage.hs_fs
