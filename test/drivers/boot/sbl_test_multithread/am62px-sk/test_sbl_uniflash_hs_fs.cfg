#-----------------------------------------------------------------------------#
#                                                                             #
#      SBL TEST CONFIGURATION FILE TO BE USED WITH THE FLASHWRITER SCRIPT     #
#                                                                             #
#-----------------------------------------------------------------------------#
#
# By default this config file,
# - points to pre-built flash writer, bootloader for this EVM
# - Make sure  application are built before running this script
# - You can use --operation=flashverify-emmc if you just want to verify the flash contents and not flash the file.
#
# AM62PX: unlike am62ax-sk, no A53 or C75 example appimage is available on
# this board/checkout (see sbl_test_custom_ipc_binary/am62px-sk — only
# mcu-r5fss0-0_freertos, wkup-r5fss0-0_freertos and system_freertos_nortos
# exist), so only the MCU-R5F single-core image is flashed below — once to
# eMMC (CONFIG_BOOTLOADER_EMMC_MCU) and once to OSPI flash
# (CONFIG_BOOTLOADER_FLASH_DSP) for TestSbl_concurrentSdOspiBoot, which reads
# the same image concurrently from both media.
#

## Uniflash stage1 and stage2 binaries ##

# First point to sbl_uart_uniflash_stage1 binary, which initialises DDR and receives sbl_uart_uniflash_stage2 binary
--flash-writer=sbl_prebuilt/am62px-sk/sbl_uart_uniflash_stage1.release.hs_fs.tiimage

# Points to sbl_uart_uniflash_stage2 binary, which function's as a server to flash one or more files to eMMC
--file=../../examples/drivers/boot/sbl_uart_uniflash_multistage/sbl_uart_uniflash_stage2/am62px-sk/wkup-r5fss0-0_nortos/ti-arm-clang/sbl_uart_uniflash_stage2.release.appimage.hs_fs --operation=flash --flash-offset=0x0

## This is a single core image ##

# MCU-R5F image is flashed at 0x800000 or to whatever offset your bootloader is configured for
--file=../../test/drivers/boot/sbl_test_multithread/sbl_test_custom_ipc_binary/am62px-sk/mcu-r5fss0-0_freertos/ti-arm-clang/sbl_test_custom_ipc_binary.release.appimage.hs_fs --operation=flash-emmc --flash-offset=0x800000

# Same MCU-R5F image also flashed to OSPI flash at 0xA00000 (CONFIG_BOOTLOADER_FLASH_DSP)
# for TestSbl_concurrentSdOspiBoot's Thread 1 (OSPI read, verify-only on AM62PX)
--file=../../test/drivers/boot/sbl_test_multithread/sbl_test_custom_ipc_binary/am62px-sk/mcu-r5fss0-0_freertos/ti-arm-clang/sbl_test_custom_ipc_binary.release.appimage.hs_fs --operation=flash --flash-offset=0xA00000
