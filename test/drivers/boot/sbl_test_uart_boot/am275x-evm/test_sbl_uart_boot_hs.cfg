#-----------------------------------------------------------------------------#
#                                                                             #
#      DEFAULT CONFIGURATION FILE TO BE USED WITH THE BOOTLOADER SCRIPT      #
#                                                                             #
#-----------------------------------------------------------------------------#
#
# By default this config file,
# - points to sbl uart bootloader for this EVM
# - The test_sbl_uart_boot appimage acts as a UART server to receive application images of other cores
# - The application images are the ipc rpmsg applications for this EVM
#   - Make sure these applications are built before running this script
# - You can customized this config file to point to your application images
#

# test_sbl_uart_boot is the bootloader (no SBL2 on AM275x) — ROM boots it directly via UART,
# then it acts as a server to receive application images of other cores through uart
--soc=am275x
--bootloader=../../../../../test/drivers/boot/sbl_test_uart_boot/am275x-evm/wkup-r5fss0-0_freertos/ti-arm-clang/test_sbl_uart_boot.release.hs.tiimage

# R5FSS0-0 image
--file=../../../../../examples/drivers/ipc/ipc_rpmsg_echo/am275x-evm/r5fss0-0_freertos/ti-arm-clang/ipc_rpmsg_echo.release.mcelf.hs

# C75SS0-0 image
--file=../../../../../examples/drivers/ipc/ipc_rpmsg_echo/am275x-evm/c75ss0-0_freertos/ti-c7000/ipc_rpmsg_echo.release.mcelf.hs
