#-----------------------------------------------------------------------------#
#                                                                             #
#      DEFAULT CONFIGURATION FILE TO BE USED WITH THE BOOTLOADER SCRIPT      #
#                                                                             #
#-----------------------------------------------------------------------------#
#
# By default this config file,
# - points to sbl uart bootloader for this EVM
# - points to sciserver appimage for the DMR5
# - The application image points to relative path of the ipc rpmsg linux application image for this EVM
#   - Make sure this application is built before running this script
# - You can customized this config file to point to your application images
#

# First point to sbl_uart binary, which function's as a server to receive application images of other cores through uart
--bootloader=../../../../../tools/boot/sbl_prebuilt/am62dx-evm/sbl_uart.release.hs_fs.tiimage

# This is DM appimage which will be loaded to the DM R5 core
--file=../../../../../test/drivers/boot/sbl_test_uart_boot/am62dx-evm/r5fss0-0_freertos/ti-arm-clang/test_sbl_uart_boot.release.appimage.hs_fs

# MCU-R5F image is flashed at 0x800000 or to whatever offset your bootloader is configured for
--file=../../../../../examples/drivers/ipc/ipc_rpmsg_echo/am62dx-evm/mcu-r5fss0-0_freertos/ti-arm-clang/ipc_rpmsg_echo.release.appimage.hs_fs

# C7x image is flashed at 0xA00000 or to whatever offset your bootloader is configured for
--file=../../../../../examples/drivers/ipc/ipc_rpmsg_echo/am62dx-evm/c75ss0-0_freertos/ti-c7000/ipc_rpmsg_echo.release.appimage.hs_fs

# C7x image is flashed at 0xA00000 or to whatever offset your bootloader is configured for
--file=../../../../../examples/drivers/ipc/ipc_rpmsg_echo/am62dx-evm/a53ss0-0_nortos/gcc-aarch64/ipc_rpmsg_echo.release.appimage.hs_fs