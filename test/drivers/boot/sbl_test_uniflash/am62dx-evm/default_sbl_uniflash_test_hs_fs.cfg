#-----------------------------------------------------------------------------#
#                                                                             #
#      DEFAULT CONFIGURATION FILE TO BE USED WITH THE BOOTLOADER SCRIPT      #
#                                                                             #
#-----------------------------------------------------------------------------#
#
# By default this config file,
# - points to sbl uart bootloader for this EVM
# - The test_sbl_uniflash appimage is loaded to the DM R5 core
#   - Make sure this application is built before running this script
#

# First point to sbl_uart binary, which function's as a server to receive application images of other cores through uart
--bootloader=sbl_prebuilt/am62dx-evm/sbl_uart.release.hs_fs.tiimage

# This is the uniflash test appimage which will be loaded to the DM R5 core
--file=../../test/drivers/boot/sbl_test_uniflash/am62dx-evm/r5fss0-0_freertos/ti-arm-clang/test_sbl_uniflash.release.appimage.hs_fs
