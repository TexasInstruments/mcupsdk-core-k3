#-----------------------------------------------------------------------------#
#                                                                             #
#      SBL UART UNIFLASH TEST CONFIGURATION FILE FOR AM275X                   #
#                                                                             #
#-----------------------------------------------------------------------------#
#
# Test flow:
#   1. The ROM bootloader receives sbl_uart_uniflash_test (the test binary)
#      directly via UART and boots it.  No DDR init / stage1 is needed because
#      AM275X runs entirely from SRAM.
#   2. The test binary acts as an XMODEM uniflash server.
#   3. For each subsequent --file entry, uart_uniflash.py wraps the file in a
#      Bootloader_UniflashFileHeader and sends it via XMODEM.  The test binary
#      processes the flash command, asserts the response header magic, and
#      returns [STATUS] SUCCESS.
#   4. When uart_uniflash.py finishes, the board's Bootloader_xmodemReceive
#      times out (~60 s) and the test exits cleanly.  Unity results are printed
#      on the wakeup UART (CONFIG_UART1).
#
# Usage (from tools/boot/):
#   python3 uart_uniflash.py -p /dev/ttyUSBx \
#       --cfg=../../test/drivers/boot/sbl_uart_uniflash_test/am275x-evm/default_sbl_uart_uniflash_test_hs_fs.cfg
#
# Notes:
#   - The nortos build is used to avoid polled-UART + FreeRTOS preemption
#     issues that can cause XMODEM CRC failures on consecutive file sends.
#   - Unity output appears on the wakeup UART (WKUP_USART0, CONFIG_UART1).
#

## Flash-writer: the test binary itself ##

# ROM boots this directly (no stage1 needed — AM275X executes from SRAM)
--flash-writer=../../test/drivers/boot/sbl_uart_uniflash_test/am275x-evm/wkup-r5fss0-0_nortos/ti-arm-clang/sbl_uart_uniflash_test.release.hs_fs.tiimage

# Test payload: flash an application image to OSPI at offset 0x80000
# This exercises the full uniflash flash command path including OSPI write
--file=../../examples/hello_world/am275x-evm/r5fss0-0_nortos/ti-arm-clang/hello_world.release.mcelf.hs_fs --operation=flash --flash-offset=0x80000
