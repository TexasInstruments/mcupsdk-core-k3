#-----------------------------------------------------------------------------#
#                                                                             #
#      SBL UART UNIFLASH TEST CONFIGURATION FILE FOR AM275X                   #
#                                                                             #
#-----------------------------------------------------------------------------#
#
# By default this config file,
# - flashes the sbl_uart_uniflash_test binary directly to AM275X OSPI flash
# - Make sure the application is built before running this script
#
# Usage:
#   python3 uart_bootloader.py -p /dev/ttyUSBx --cfg=<path_to_this_file>
#
# The sbl_uart_uniflash_test binary acts as a uniflash server:
# - It receives files via XMODEM over UART
# - Processes flash/erase/verify commands
# - Returns a status response to the host
#

--soc=am275x
--bootloader=../../../../../test/drivers/boot/sbl_uart_uniflash_test/am275x-evm/wkup-r5fss0-0_nortos/ti-arm-clang/sbl_uart_uniflash_test.release.hs_fs.tiimage
