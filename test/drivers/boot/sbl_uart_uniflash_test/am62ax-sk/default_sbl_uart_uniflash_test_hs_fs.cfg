#-----------------------------------------------------------------------------#
#                                                                             #
#      SBL UART UNIFLASH TEST CONFIGURATION FILE FOR AM62AX                   #
#                                                                             #
#-----------------------------------------------------------------------------#
#
# Test flow:
#   1. sbl_uart_uniflash_stage1 initialises DDR, receives the
#      sbl_uart_uniflash_test binary (stage2) via UART and boots it.
#   2. The stage2 binary (nortos build) acts as an XMODEM uniflash server.
#   3. For each subsequent --file entry, uart_uniflash.py wraps the file in a
#      Bootloader_UniflashFileHeader and sends it via XMODEM.  The test binary
#      processes the flash command, asserts the response header magic, and
#      returns [STATUS] SUCCESS.
#   4. When uart_uniflash.py finishes, the board's Bootloader_xmodemReceive
#      times out (~60 s) and the test exits cleanly.  Unity results are printed
#      on the wakeup UART (CONFIG_UART1).
#
# Usage (from tools/boot/):
#   python3 uart_uniflash.py -p /dev/ttyUSBx \
#       --cfg=../../test/drivers/boot/sbl_uart_uniflash_test/am62ax-sk/default_sbl_uart_uniflash_test_hs_fs.cfg
#
# Notes:
#   - The nortos build is used to avoid polled-UART + FreeRTOS preemption
#     issues that can cause XMODEM CRC failures on consecutive file sends.
#   - Unity output appears on the wakeup UART (WKUP_USART0, CONFIG_UART1).
#

## Uniflash stage1 binary ##

# Stage1 initialises DDR and receives/boots stage2 (our test binary)
--flash-writer=sbl_prebuilt/am62ax-sk/sbl_uart_uniflash_stage1.release.hs_fs.tiimage

# Stage2: the test binary itself (nortos build for reliable XMODEM operation)
# This is flashed to OSPI at offset 0x0 by the test binary's own server loop
# NOTE: Use the nortos build directly — the sbl_prebuilt copy can be overwritten
#       by the freertos makefile (both copy to the same filename).
--file=../../test/drivers/boot/sbl_uart_uniflash_test/am62ax-sk/r5fss0-0_nortos/ti-arm-clang/sbl_uart_uniflash_test.release.appimage.hs_fs --operation=flash --flash-offset=0x0

# Test payload: flash an application image to OSPI at offset 0x100000
# This exercises the full uniflash flash command path including OSPI write
--file=../../examples/drivers/ipc/ipc_rpmsg_echo/am62ax-sk/mcu-r5fss0-0_freertos/ti-arm-clang/ipc_rpmsg_echo.release.appimage.hs_fs --operation=flash --flash-offset=0x100000
