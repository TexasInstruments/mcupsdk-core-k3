#-----------------------------------------------------------------------------#
#                                                                             #
#      DEFAULT CONFIGURATION FILE TO BE USED WITH THE FLASHWRITER SCRIPT      #
#                                                                             #
#-----------------------------------------------------------------------------#
# This config file flashes the MCU-R5F DDR FreeRTOS test appimage onto AM62Dx EVM (HS-FS device).
#
# Boot chain:
#   1. sbl_ospi_stage1 (ROM-bootable, at 0x0)         - loaded by ROM
#   2. sbl_ospi_stage2 (DM firmware + SBL, at 0x80000) - initialises DDR, boots cores
#   3. HSM appimage (at 0x240000)
#   4. MCU-R5F test appimage (at 0x800000)             - loaded by stage2
#
# NOTE: sbl_uart_uniflash_stage2 written first so the flashwriter can receive
#       subsequent files; sbl_ospi_stage1 then OVERWRITES it at 0x0.

# Step 1: Load flash writer (stage1 runs from MCU SRAM via UART)
--flash-writer=sbl_prebuilt/am62dx-evm/sbl_uart_uniflash_stage1.release.hs.tiimage

# Step 2: Flash uniflash stage2 temporarily at 0x0 so it can receive more files
--file=../../examples/drivers/boot/sbl_uart_uniflash_multistage/sbl_uart_uniflash_stage2/am62dx-evm/r5fss0-0_nortos/ti-arm-clang/sbl_uart_uniflash_stage2.release.appimage.hs --operation=flash --flash-offset=0x0

# Step 3: Program OSPI PHY tuning vector (required for reliable OSPI reads at boot)
--operation=flash-phy-tuning-data

# Step 4: Flash the real application SBL stage1 at 0x0 (OVERWRITES uniflash stage2)
#         ROM boots this on the next power cycle.
--file=sbl_prebuilt/am62dx-evm/sbl_ospi_stage1.release.hs.tiimage --operation=flash --flash-offset=0x0

# Step 5: Flash SBL stage2 with DM firmware at 0x80000
#         Stage1 loads this; it initialises DDR, clocks, and loads other cores.
--file=sbl_prebuilt/am62dx-evm/sbl_ospi_stage2.release.appimage.hs --operation=flash --flash-offset=0x80000

# Step 6: Flash HSM runtime appimage
--file=../../tools/boot/HSMAppimageGen/board/am62dx-evm/hsm.appimage.hs --operation=flash --flash-offset=0x240000

# Step 7: Flash the MCU-R5F DDR FreeRTOS test appimage
#         Stage2 loads this onto the MCU-R5F core after DDR is ready.
--file=../../test/drivers/ddr/am62dx-evm/mcu-r5fss0-0_freertos/ti-arm-clang/test_ddr.release.appimage.hs --operation=flash --flash-offset=0x800000
