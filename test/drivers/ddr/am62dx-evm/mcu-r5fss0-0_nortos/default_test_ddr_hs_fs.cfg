#-----------------------------------------------------------------------------#
#                                                                             #
#      DEFAULT CONFIGURATION FILE TO BE USED WITH THE FLASHWRITER SCRIPT      #
#                                                                             #
#-----------------------------------------------------------------------------#
#
# This config file flashes the MCU-R5F DDR test application image onto AM62Dx EVM.
# The test runs DDR memory access and ECC tests supported on the MCU-R5F core.
# DDR is initialized by the DM-R5F (r5fss0-0) SBL before the MCU-R5F app starts.
#

# Step 1: Load flash writer (stage1 runs from MCU SRAM via UART)
--flash-writer=sbl_prebuilt/am62dx-evm/sbl_uart_uniflash_stage1.release.hs_fs.tiimage

# Step 2: Flash uniflash stage2 temporarily at 0x0 so it can receive more files
--file=../../examples/drivers/boot/sbl_uart_uniflash_multistage/sbl_uart_uniflash_stage2/am62dx-evm/r5fss0-0_nortos/ti-arm-clang/sbl_uart_uniflash_stage2.release.appimage.hs_fs --operation=flash --flash-offset=0x0

# Step 3: Program OSPI PHY tuning vector (required for reliable OSPI reads at boot)
--operation=flash-phy-tuning-data

# Step 4: Flash the real application SBL stage1 at 0x0 (OVERWRITES uniflash stage2)
#         ROM boots this on the next power cycle.
--file=sbl_prebuilt/am62dx-evm/sbl_ospi_stage1.release.hs_fs.tiimage --operation=flash --flash-offset=0x0

# Step 5: Flash SBL stage2 with DM firmware at 0x80000
#         Stage1 loads this; it initialises DDR, clocks, and loads other cores.
--file=sbl_prebuilt/am62dx-evm/sbl_ospi_stage2.release.appimage.hs_fs --operation=flash --flash-offset=0x80000

# Step 6: Flash HSM runtime appimage
--file=../../tools/boot/HSMAppimageGen/board/am62dx-evm/hsm.appimage.hs_fs --operation=flash --flash-offset=0x240000

# Step 7: Flash the MCU-R5F DDR NoRTOS test appimage
#         Stage2 loads this onto the MCU-R5F core after DDR is ready.
--file=../../test/drivers/ddr/am62dx-evm/mcu-r5fss0-0_nortos/ti-arm-clang/test_ddr.release.appimage.hs_fs --operation=flash --flash-offset=0x800000
