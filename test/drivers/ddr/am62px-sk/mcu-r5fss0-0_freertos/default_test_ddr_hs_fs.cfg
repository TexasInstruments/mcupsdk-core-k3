#-----------------------------------------------------------------------------#
#                                                                             #
#      DEFAULT CONFIGURATION FILE TO BE USED WITH THE FLASHWRITER SCRIPT      #
#                                                                             #
#-----------------------------------------------------------------------------#
# This config file flashes the MCU-R5F DDR FreeRTOS test appimage onto AM62Px SK (HS-FS device).
#
# Boot chain (AM62Px Linux SBL):
#   1. sbl_ospi_linux_stage1 (ROM-bootable, at 0x0)      - loaded by ROM
#   2. ipc_rpmsg_echo_linux  (wkup-r5f DM firmware, at 0x80000) - initialises DDR, boots MCU-R5F
#   3. HSM appimage (at 0x240000)
#   4. MCU-R5F test appimage (at 0x800000)               - loaded by stage1
#
# NOTE: sbl_uart_uniflash_stage2 written first so the flashwriter can receive
#       subsequent files; sbl_ospi_linux_stage1 then OVERWRITES it at 0x0.

# Step 1: Load flash writer (stage1 runs from MCU SRAM via UART)
--flash-writer=sbl_prebuilt/am62px-sk/sbl_uart_uniflash_stage1.release.hs_fs.tiimage

# Step 2: Flash uniflash stage2 temporarily at 0x0 so it can receive more files
--file=../../examples/drivers/boot/sbl_uart_uniflash_multistage/sbl_uart_uniflash_stage2/am62px-sk/wkup-r5fss0-0_nortos/ti-arm-clang/sbl_uart_uniflash_stage2.release.appimage.hs_fs --operation=flash --flash-offset=0x0

# Step 3: Program OSPI PHY tuning vector (required for reliable OSPI reads at boot)
--operation=flash-phy-tuning-data

# Step 4: Flash the real application SBL stage1 at 0x0 (overwrites uniflash stage2)
--file=sbl_prebuilt/am62px-sk/sbl_ospi_linux_stage1.release.hs_fs.tiimage --operation=flash --flash-offset=0x0

# Step 5: Flash wkup-r5f DM firmware at 0x80000
--file=../../examples/drivers/ipc/ipc_rpmsg_echo_linux/am62px-sk/wkup-r5fss0-0_freertos/ti-arm-clang/ipc_rpmsg_echo_linux.release.appimage.hs_fs --operation=flash --flash-offset=0x80000

# Step 6: Flash HSM runtime appimage
--file=../../tools/boot/HSMAppimageGen/board/am62px-sk/hsm.appimage.hs_fs --operation=flash --flash-offset=0x240000

# Step 7: Flash the MCU-R5F DDR FreeRTOS test appimage
--file=../../test/drivers/ddr/am62px-sk/mcu-r5fss0-0_freertos/ti-arm-clang/test_ddr.release.appimage.hs_fs --operation=flash --flash-offset=0x800000
