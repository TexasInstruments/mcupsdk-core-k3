#-----------------------------------------------------------------------------#
#                                                                             #
#      DEFAULT CONFIGURATION FILE TO BE USED WITH THE FLASHWRITER SCRIPT      #
#                                                                             #
#-----------------------------------------------------------------------------#
#
# This config file flashes the M4F DDR NoRTOS test application onto AM62x SK
# (HS-FS device).  The M4F appimage requires a DM appimage on the R5F core to
# service TISCI messages.  A hello_world DM appimage is used here.
#
# Boot chain (OSPI NOR):
#   1. sbl_ospi_stage1 (ROM-bootable, at 0x0)
#   2. sbl_ospi_stage2 (DM firmware, at 0x80000) - initialises DDR, loads cores
#   3. HSM appimage (at 0x800000)
#   4. M4F DDR test appimage (at 0x100000)    - loaded onto m4fss0-0
#   5. R5F DM hello_world appimage (at 0xA00000) - loaded onto r5fss0-0
#

# Step 1: Load flash writer stage1 (runs from MCU SRAM via UART)
--flash-writer=sbl_prebuilt/am62x-sk/sbl_uart_uniflash_stage1.release.hs_fs.tiimage

# Step 2: Flash uniflash stage2 temporarily at 0x0 (receives subsequent files)
--file=../../examples/drivers/boot/sbl_uart_uniflash_multistage/sbl_uart_uniflash_stage2/am62x-sk/r5fss0-0_nortos/ti-arm-clang/sbl_uart_uniflash_stage2.release.appimage.hs_fs --operation=flash --flash-offset=0x0

# Step 3: Program OSPI PHY tuning vector
--operation=flash-phy-tuning-data

# Step 4: Flash the real SBL stage1 at 0x0 (overwrites uniflash stage2)
--file=sbl_prebuilt/am62x-sk/sbl_ospi_stage1.release.hs_fs.tiimage --operation=flash --flash-offset=0x0

# Step 5: Flash SBL stage2 at 0x80000
--file=../../examples/drivers/boot/sbl_ospi_multistage/sbl_ospi_stage2/am62x-sk/r5fss0-0_nortos/ti-arm-clang/sbl_ospi_stage2.release.appimage.hs_fs --operation=flash --flash-offset=0x80000

# Step 6: Flash HSM runtime appimage
--file=../../tools/boot/HSMAppimageGen/board/am62x-sk/hsm.appimage.hs_fs --operation=flash --flash-offset=0x800000

# Step 7: Flash M4F DDR NoRTOS test appimage
--file=../../test/drivers/ddr/am62x-sk/m4fss0-0_nortos/ti-arm-clang/test_ddr.release.appimage.hs_fs --operation=flash --flash-offset=0x100000

# Step 8: Flash hello_world R5F DM appimage (required so DM core is running)
--file=../../examples/hello_world/am62x-sk/r5fss0-0_freertos/ti-arm-clang/hello_world.release.appimage.hs_fs --operation=flash --flash-offset=0xA00000
