#-----------------------------------------------------------------------------#
#                                                                             #
#      DEFAULT CONFIGURATION FILE TO BE USED WITH THE BOOTLOADER SCRIPT      #
#                                                                             #
#-----------------------------------------------------------------------------#
#
# DDR system test configuration for AM62Dx EVM (HS-FS).
# Loads test appimages onto all cores via SBL UART bootloader.
#   - r5fss0-0 (DM core): DDR write/read test + system test orchestrator
#   - mcu-r5fss0-0:       DDR write/read test
#   - c75ss0-0:           dummy test
#   - a53ss0-0:           dummy test
#

# First point to sbl_uart binary, which function's as a server to receive application images of other cores through uart
--bootloader=sbl_prebuilt/am62dx-evm/sbl_uart.release.hs.tiimage

# MCU R5 core appimage
--file=../../test/drivers/ddr/test_ddr_system/am62dx-evm/mcu-r5fss0-0_freertos/ti-arm-clang/test_ddr_system.release.appimage.hs

# DM R5 core appimage
--file=../../test/drivers/ddr/test_ddr_system/am62dx-evm/r5fss0-0_freertos/ti-arm-clang/test_ddr_system.release.appimage.hs

# C75 DSP core appimage
--file=../../test/drivers/ddr/test_ddr_system/am62dx-evm/c75ss0-0_freertos/ti-c7000/test_ddr_system.release.appimage.hs

# A53 core appimage
--file=../../test/drivers/ddr/test_ddr_system/am62dx-evm/a53ss0-0_freertos/gcc-aarch64/test_ddr_system.release.appimage.hs


