#      DEFAULT CONFIGURATION FILE TO BE USED WITH THE BOOTLOADER SCRIPT      #
#                                                                             #
#-----------------------------------------------------------------------------#
#
# DDR system test configuration for AM62Px SK (HS-FS).
# Loads test appimages onto R5 cores via SBL UART bootloader.
#   - wkup-r5f: DDR write/read test + system test orchestrator
#   - mcu-r5f:  DDR write/read test
#

# First point to sbl_uart binary, which function's as a server to receive application images of other cores through uart
--bootloader=sbl_prebuilt/am62px-sk/sbl_uart.release.hs.tiimage

# MCU R5 core appimage
--file=../../test/drivers/ddr/test_ddr_system/am62px-sk/mcu-r5fss0-0_freertos/ti-arm-clang/test_ddr_system.release.appimage.hs

# Wakeup R5 core appimage
--file=../../test/drivers/ddr/test_ddr_system/am62px-sk/wkup-r5fss0-0_freertos/ti-arm-clang/test_ddr_system.release.appimage.hs


