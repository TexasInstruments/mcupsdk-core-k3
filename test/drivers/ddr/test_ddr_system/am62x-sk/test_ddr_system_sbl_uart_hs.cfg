#-----------------------------------------------------------------------------#
#                                                                             #
#      DEFAULT CONFIGURATION FILE TO BE USED WITH THE BOOTLOADER SCRIPT      #
#                                                                             #
#-----------------------------------------------------------------------------#
#
# DDR system test configuration for AM62x SK (HS-FS).
# Loads test appimages onto cores via SBL UART bootloader.
#   - r5fss0-0 (DM core): DDR init + write/read test + system test orchestrator
#   - m4fss0-0:           DDR write/read test
#

# First point to sbl_uart binary, which functions as a server to receive application images of other cores through uart
--bootloader=sbl_prebuilt/am62x-sk/sbl_uart.release.hs.tiimage

# DM R5 core appimage (freertos, includes DDR init via syscfg)
--file=../../test/drivers/ddr/test_ddr_system/am62x-sk/r5fss0-0_freertos/ti-arm-clang/test_ddr_system.release.appimage.hs

# M4F core appimage (freertos, DDR already initialised by SBL)
--file=../../test/drivers/ddr/test_ddr_system/am62x-sk/m4fss0-0_freertos/ti-arm-clang/test_ddr_system.release.appimage.hs
