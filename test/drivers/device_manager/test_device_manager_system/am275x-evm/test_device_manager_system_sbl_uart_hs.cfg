#-----------------------------------------------------------------------------#
#                                                                             #
#      DEFAULT CONFIGURATION FILE TO BE USED WITH THE BOOTLOADER SCRIPT      #
#                                                                             #
#-----------------------------------------------------------------------------#
#
# By default this config file,
# - points to sbl uart bootloader for this EVM
# - points to sciserver mcelf for the DMR5
# - The application image points to relative path of the ipc rpmsg linux application image for this EVM
#   - Make sure this application is built before running this script
# - You can customized this config file to point to your application images
#

Mention the soc name for am275x
--soc=am275x

# First point to sbl_uart binary, which function's as a server to receive application images of other cores through uart
--bootloader=sbl_prebuilt/am275x-evm/sbl_uart.release.hs.tiimage

# # This is DSP mcelf which will be loaded to the C750_0 core
--file=../../test/drivers/device_manager/test_device_manager_system/am275x-evm/c75ss0-0_freertos/ti-c7000/test_device_manager_system.release.mcelf.hs

# # This is r5f mcelf which will be loaded to the R5FSS0_0 core
--file=../../test/drivers/device_manager/test_device_manager_system/am275x-evm/r5fss0-0_freertos/ti-arm-clang/test_device_manager_system.release.mcelf.hs

# # This is r5f mcelf which will be loaded to the R5FSS0_1 core
--file=../../test/drivers/device_manager/test_device_manager_system/am275x-evm/r5fss0-1_freertos/ti-arm-clang/test_device_manager_system.release.mcelf.hs

# # This is r5f mcelf which will be loaded to the R5FSS1_0 core
--file=../../test/drivers/device_manager/test_device_manager_system/am275x-evm/r5fss1-0_freertos/ti-arm-clang/test_device_manager_system.release.mcelf.hs

# # This is r5f mcelf which will be loaded to the R5FSS1_1 core
--file=../../test/drivers/device_manager/test_device_manager_system/am275x-evm/r5fss1-1_freertos/ti-arm-clang/test_device_manager_system.release.mcelf.hs