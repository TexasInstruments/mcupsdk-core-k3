#-----------------------------------------------------------------------------#
#                                                                             #
#      DEFAULT CONFIGURATION FILE TO BE USED WITH THE BOOTLOADER SCRIPT      #
#                                                                             #
#-----------------------------------------------------------------------------#
#
# By default this config file,
# - points to sbl uart bootloader for this EVM
# - points to sciserver appimage for the DMR5
# - The application image points to relative path of the ipc rpmsg linux application image for this EVM
#   - Make sure this application is built before running this script
# - You can customized this config file to point to your application images
#
--soc=am275x
# First point to sbl_uart binary, which function's as a server to receive application images of other cores through uart
--bootloader=sbl_prebuilt/am275x-evm/sbl_uart.release.hs_fs.tiimage

# This is R5F appimage which will be loaded to the R5FSS0-0 core
--file=../../test/drivers/ecap/test_ecap_system/am275x-evm/r5fss0-0_freertos/ti-arm-clang/test_ecap_system.release.mcelf.hs_fs

# This is R5F appimage which will be loaded to the R5FSS0-1 core
--file=../../test/drivers/ecap/test_ecap_system/am275x-evm/r5fss0-1_freertos/ti-arm-clang/test_ecap_system.release.mcelf.hs_fs

# This is R5F appimage which will be loaded to the R5FSS1-0 core
--file=../../test/drivers/ecap/test_ecap_system/am275x-evm/r5fss1-0_freertos/ti-arm-clang/test_ecap_system.release.mcelf.hs_fs

# This is R5F appimage which will be loaded to the R5FSS1-1 core
--file=../../test/drivers/ecap/test_ecap_system/am275x-evm/r5fss1-1_freertos/ti-arm-clang/test_ecap_system.release.mcelf.hs_fs

# This is DSP appimage which will be loaded to the C75SS0-0 core
--file=../../test/drivers/ecap/test_ecap_system/am275x-evm/c75ss0-0_freertos/ti-c7000/test_ecap_system.release.mcelf.hs_fs

# This is DSP appimage which will be loaded to the C75SS1-0 core
--file=../../test/drivers/ecap/test_ecap_system/am275x-evm/c75ss1-0_freertos/ti-c7000/test_ecap_system.release.mcelf.hs_fs

