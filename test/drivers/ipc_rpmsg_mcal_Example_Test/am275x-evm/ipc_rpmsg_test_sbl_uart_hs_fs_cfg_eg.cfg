#
# This config file (for ipc_rpmsg_mcal_2 - Runtime DeInit/Init Test),
# - points to sbl uart bootloader for this EVM
# - points to MCAL CFG3 application on R5FSS0_0
# - Loads test applications on 4 remote cores (R5FSS0_1, R5FSS1_0, R5FSS1_1, C75SS0_0)
# - C75SS1_0 is EXCLUDED from this configuration
# - The application images point to ipc_rpmsg_mcal_2 test binaries
#   - Make sure these applications are built before running this script
#

# Mention the soc name for am275x
--soc=am275x

# First point to sbl_uart binary, which function's as a server to receive application images of other cores through uart
--bootloader=/home/uda0507213/ti/jacinto/workarea/mcu_plus_sdk/tools/boot/sbl_prebuilt/am275x-evm/sbl_uart.release.hs_fs.tiimage

# This is MCAL CFG3 appimage which will be loaded to the R50-0 core
--file=/home/uda0507213/ti/jacinto/workarea/mcusw/binary/cdd_ipc_app/bin/am275x_evm/cdd_ipc_app_mcu0_0_release.mcelf.hs_fs

