#-----------------------------------------------------------------------------#
#                                                                             #
#      DEFAULT CONFIGURATION FILE TO BE USED WITH THE BOOTLOADER SCRIPT      #
#                                                                             #
#-----------------------------------------------------------------------------#
#
# By default this config file,
# - points to sbl uart bootloader for this EVM
# - points to the application images for the R5F and A53 cores
# - Make sure the application images are built before running this script
# - You can customize this config file to point to your application images
#

# First point to sbl_uart binary, which functions as a server to receive application images of other cores through uart
--bootloader=sbl_prebuilt/am62x-sk/sbl_uart.release.hs_fs.tiimage

# This is A53 master appimage which will be loaded to the A53 core
--file=../../test/drivers/mcspi/mcspi_master_slave/am62x-sk/a53ss0-0_freertos/gcc-aarch64/test_mcspi_master_slave.release.appimage.hs_fs

# This is R5F slave appimage which will be loaded to the R5F core
--file=../../test/drivers/mcspi/mcspi_master_slave/am62x-sk/r5fss0-0_freertos/ti-arm-clang/test_mcspi_master_slave.release.appimage.hs_fs

# This is M4F dummy appimage which will be loaded to the M4F core
--file=../../test/drivers/mcspi/mcspi_master_slave/am62x-sk/m4fss0-0_freertos/ti-arm-clang/test_mcspi_master_slave.release.appimage.hs_fs
