#-----------------------------------------------------------------------------#
#                                                                             #
#      DEFAULT CONFIGURATION FILE TO BE USED WITH THE BOOTLOADER SCRIPT      #
#                                                                             #
#-----------------------------------------------------------------------------#
#
# By default this config file,
# - points to sbl uart bootloader for this EVM
# - points to sciserver appimage for the DM R5
# - The application image points to relative path of the mcspi master slave dma
#   application image for this EVM
#   - Make sure this application is built before running this script
# - You can customized this config file to point to your application images
#

# First point to sbl_uart binary, which function's as a server to receive application images of other cores through uart
--bootloader=sbl_prebuilt/am62px-sk/sbl_uart.release.hs.tiimage

# This is example appimage which will be loaded to the MCU R5 core (slave DMA)
--file=../../test/drivers/mcspi/mcspi_master_slave_dma/am62px-sk/mcu-r5fss0-0_freertos/ti-arm-clang/test_mcspi_master_slave_dma.release.appimage.hs

# This is DM appimage which will be loaded to the WKUP R5 core (master DMA + DM)
--file=../../test/drivers/mcspi/mcspi_master_slave_dma/am62px-sk/wkup-r5fss0-0_freertos/ti-arm-clang/test_mcspi_master_slave_dma.release.appimage.hs

