#-----------------------------------------------------------------------------#
#                                                                             #
#      DEFAULT CONFIGURATION FILE TO BE USED WITH THE FLASHWRITER SCRIPT      #
#                                                                             #
#-----------------------------------------------------------------------------#
#
# By default this config file,
# - points to pre-built flash writer and OSPI bootloader for this EVM
# - Flashes SBL OSPI, the test application image, and the XIP image in one step
# - Make sure the test binary is built before running this script
#
# Usage (from tools/boot/ directory):
#   python3 uart_uniflash.py -p /dev/ttyUSBx --cfg=../../test/drivers/optiflash/am275x-evm/r5fss1-0_freertos/test_optiflash_sbl_ospi_hs_fs.cfg
#

# First point to sbl_uart_uniflash binary, which function's as a server to flash one or more files
--flash-writer=sbl_prebuilt/am275x-evm/sbl_uart_uniflash.release.hs_fs.tiimage

# Program the OSPI PHY tuning attack vector
--operation=flash-phy-tuning-data

# Flash the SBL OSPI bootloader at offset 0x0
--file=sbl_prebuilt/am275x-evm/sbl_ospi.release.hs_fs.tiimage --operation=flash --flash-offset=0x0

# Erase other R5F image slots to prevent stale images from booting alongside this test
--operation=erase --flash-offset=0x400000 --erase-size=0x10000
--operation=erase --flash-offset=0x800000 --erase-size=0x10000
--operation=erase --flash-offset=0x1000000 --erase-size=0x10000

# Flash the test_optiflash application image at offset 0xC00000 (r5f1-0 image slot)
--file=../../test/drivers/optiflash/am275x-evm/r5fss1-0_freertos/ti-arm-clang/test_optiflash.release.mcelf.hs_fs --operation=flash --flash-offset=0xC00000

# Flash the XIP image (contains TestOptiflash_loadFunction at 0x60100000 in OSPI)
--file=../../test/drivers/optiflash/am275x-evm/r5fss1-0_freertos/ti-arm-clang/test_optiflash.release.mcelf_xip --operation=flash-xip
