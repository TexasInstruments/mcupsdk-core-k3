#-----------------------------------------------------------------------------#
#                                                                             #
#      DEFAULT CONFIGURATION FILE TO BE USED WITH THE BOOTLOADER SCRIPT      #
#                                                                             #
#-----------------------------------------------------------------------------#
#
# By default this config file,
# - points to sbl uart bootloader for am62px-sk
# - The application images point to relative paths of the pinmux system test
#   application images for am62px-sk
#   - Make sure all application images are built before running this script
# - You can customize this config file to point to your application images
#

# First point to sbl_uart binary, which functions as a server to receive application
# images of other cores through uart
--bootloader=sbl_prebuilt/am62px-sk/sbl_uart.release.hs.tiimage

# This is test appimage which will be loaded to the MCU R5 core (master test runner)
--file=../../test/drivers/pinmux_coverage/test_pinmux_system/am62px-sk/mcu-r5fss0-0_freertos/ti-arm-clang/test_pinmux_system.release.appimage.hs

# This is DM appimage which will be loaded to the WKUP R5 core (device manager)
--file=../../test/drivers/pinmux_coverage/test_pinmux_system/am62px-sk/wkup-r5fss0-0_freertos/ti-arm-clang/test_pinmux_system.release.appimage.hs
