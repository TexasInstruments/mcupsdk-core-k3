#-----------------------------------------------------------------------------#
#                                                                             #
#      DEFAULT CONFIGURATION FILE TO BE USED WITH THE BOOTLOADER SCRIPT      #
#                                                                             #
#-----------------------------------------------------------------------------#
#
# By default this config file,
# - points to sbl uart bootloader for this board
# - points to DM R5, M4F, and A53 appimages for this board
# - Make sure these application images are built before running this script
# - You can customize this config file to point to your application images
#

# First point to sbl_uart binary, which functions as a server to receive application images of other cores through UART
--bootloader=sbl_prebuilt/am62x-sk/sbl_uart.release.hs.tiimage

# This is appimage which will be loaded to the M4F core
--file=../../test/drivers/udma/test_udma_system/am62x-sk/m4fss0-0_freertos/ti-arm-clang/test_udma_system.release.appimage.hs

# This is DM appimage which will be loaded to the DM R5 core
--file=../../test/drivers/udma/test_udma_system/am62x-sk/r5fss0-0_freertos/ti-arm-clang/test_udma_system.release.appimage.hs

# This is A53 appimage which will be loaded to the A53 core
--file=../../test/drivers/udma/test_udma_system/am62x-sk/a53ss0-0_freertos/gcc-aarch64/test_udma_system.release.appimage.hs
