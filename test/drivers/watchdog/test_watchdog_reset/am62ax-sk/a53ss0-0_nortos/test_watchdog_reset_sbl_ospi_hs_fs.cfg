#-----------------------------------------------------------------------------#
#                                                                             #
#   FLASH CONFIGURATION FOR test_watchdog_reset (AM62AX A53 NoRTOS)          #
#                                                                             #
#-----------------------------------------------------------------------------#
#
# Usage (run from mcu_plus_sdk/tools/boot/ directory):
#   1. Set board boot mode pins to UART boot mode
#   2. python uart_uniflash.py -p /dev/ttyUSB0 --cfg=../../test/drivers/watchdog/test_watchdog_reset/am62ax-sk/a53ss0-0_nortos/test_watchdog_reset_sbl_ospi_hs_fs.cfg
#   3. After flashing, switch boot mode pins to OSPI NAND and reset board
#

# Flash writer (stage1 initialises DDR, stage2 handles flash operations)
--flash-writer=sbl_prebuilt/am62ax-sk/sbl_uart_uniflash_stage1.release.hs_fs.tiimage

# Stage2 flash server (loaded to DDR, not written to flash)
--file=../../examples/drivers/boot/sbl_uart_uniflash_multistage/sbl_uart_uniflash_stage2/am62ax-sk/r5fss0-0_nortos/ti-arm-clang/sbl_uart_uniflash_stage2.release.appimage.hs_fs --operation=flash --flash-offset=0x0

# SBL OSPI NAND Stage1 bootloader at offset 0x0
--file=sbl_prebuilt/am62ax-sk/sbl_ospi_nand_stage1.release.hs_fs.tiimage --operation=flash --flash-offset=0x0

# SBL OSPI NAND Stage2 at offset 0x80000
--file=../../examples/drivers/boot/sbl_ospi_nand_multistage/sbl_ospi_nand_stage2/am62ax-sk/r5fss0-0_nortos/ti-arm-clang/sbl_ospi_nand_stage2.release.appimage.hs_fs --operation=flash --flash-offset=0x80000

# DM R5 image at offset 0xC0000
--file=../../examples/drivers/ipc/ipc_rpmsg_echo/am62ax-sk/r5fss0-0_freertos/ti-arm-clang/ipc_rpmsg_echo.release.appimage.hs_fs --operation=flash --flash-offset=0xC0000

# HSM image at offset 0x240000
--file=../../tools/boot/HSMAppimageGen/board/am62ax-sk/hsm.appimage.hs_fs --operation=flash --flash-offset=0x240000

# A53 NoRTOS watchdog reset test at offset 0x1200000
--file=../../test/drivers/watchdog/test_watchdog_reset/am62ax-sk/a53ss0-0_nortos/gcc-aarch64/test_watchdog_reset.release.appimage.hs_fs --operation=flash --flash-offset=0x1200000
