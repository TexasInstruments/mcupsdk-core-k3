#-----------------------------------------------------------------------------#
#                                                                             #
#   FLASH CONFIGURATION FOR test_watchdog_reset (AM62DX A53 FreeRTOS)        #
#                                                                             #
#-----------------------------------------------------------------------------#
#
# Usage (run from mcu_plus_sdk/tools/boot/ directory):
#   1. Set board boot mode pins to UART boot mode
#   2. python uart_uniflash.py -p /dev/ttyUSB0 --cfg=../../test/drivers/watchdog/test_watchdog_reset/am62dx-evm/a53ss0-0_freertos/test_watchdog_reset_sbl_ospi_hs_fs.cfg
#   3. After flashing, switch boot mode pins to OSPI and reset board
#

# Flash writer (stage1 initialises DDR, stage2 handles flash operations)
--flash-writer=sbl_prebuilt/am62dx-evm/sbl_uart_uniflash_stage1.release.hs_fs.tiimage

# Stage2 flash server (loaded to DDR, not written to flash)
--file=../../examples/drivers/boot/sbl_uart_uniflash_multistage/sbl_uart_uniflash_stage2/am62dx-evm/r5fss0-0_nortos/ti-arm-clang/sbl_uart_uniflash_stage2.release.appimage.hs_fs --operation=flash --flash-offset=0x0

# Program OSPI PHY tuning data
--operation=flash-phy-tuning-data

# SBL OSPI Stage1 bootloader at offset 0x0
--file=sbl_prebuilt/am62dx-evm/sbl_ospi_stage1.release.hs_fs.tiimage --operation=flash --flash-offset=0x0

# SBL OSPI Stage2 (DM firmware) at offset 0x80000
--file=sbl_prebuilt/am62dx-evm/sbl_ospi_stage2.release.appimage.hs_fs --operation=flash --flash-offset=0x80000

# HSM image at offset 0x240000
--file=../../tools/boot/HSMAppimageGen/board/am62dx-evm/hsm.appimage.hs_fs --operation=flash --flash-offset=0x240000

# MCU-R5F placeholder at offset 0x800000 (required by SBL Stage 2)
--file=../../examples/drivers/ipc/ipc_rpmsg_echo/am62dx-evm/mcu-r5fss0-0_freertos/ti-arm-clang/ipc_rpmsg_echo.release.appimage.hs_fs --operation=flash --flash-offset=0x800000

# C7x DSP placeholder at offset 0xA00000 (required by SBL Stage 2)
--file=../../examples/drivers/ipc/ipc_rpmsg_echo/am62dx-evm/c75ss0-0_freertos/ti-c7000/ipc_rpmsg_echo.release.appimage.hs_fs --operation=flash --flash-offset=0xA00000

# A53 FreeRTOS watchdog reset test at offset 0x1200000
--file=../../test/drivers/watchdog/test_watchdog_reset/am62dx-evm/a53ss0-0_freertos/gcc-aarch64/test_watchdog_reset.release.appimage.hs_fs --operation=flash --flash-offset=0x1200000
