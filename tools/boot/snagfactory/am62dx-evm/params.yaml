board_name: am62dx-evm
soc_model: am62d2

fb_buffer_addr: "0x82000000"
fb_buffer_size: "0x7000000"

usb_ids:
  vid: "0451"
  pid: "6165"

usb-path: ~ 

recovery_firmware:
  tiboot3:
    path: "am62dx-evm/tiboot3.bin"
  tispl:
    path: "am62dx-evm/tispl.bin"
  u-boot:
    path: "am62dx-evm/u-boot.img"

targets:
  emmc:
    target_device:    mmc0
    hwpart:           1
    eraseblk_size:    ~
    operation_filter: flash-emmc
    pre_flash_tasks:
      - task: reset

  ospi-nor:
    target_device:    nor0
    hwpart:           ~
    eraseblk_size:    "0x10000"
    operation_filter: flash
    pre_flash_tasks:  []