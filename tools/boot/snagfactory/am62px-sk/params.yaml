board_name: am62px-sk
soc_model:  am62p

fb_buffer_addr: "0x82000000"
fb_buffer_size:  "0x7000000"

usb_ids:
  vid: "0451"
  pid: "6165"

usb_path: ~

recovery_firmware:
  tiboot3:
    path: "am62px-sk/tiboot3.bin"
  tispl:
    path: "am62px-sk/tispl.bin"
  u-boot:
    path: "am62px-sk/u-boot.img"

targets:
  emmc:
    target_device:    mmc0
    hwpart:           1
    eraseblk_size:    ~
    operation_filter: flash-emmc
    pre_flash_tasks:
      - task: reset

  ospi-nor:
    target_device:    nor0
    hwpart:           ~
    eraseblk_size:    "0x40000"
    operation_filter: flash
    pre_flash_tasks:  []